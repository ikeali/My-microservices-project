name: PAYMENT SERVICE CI/CD


permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - 'payment_service/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GHCR
        run: echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.actor }}/payment_service:${{ github.sha }} ./payment_service

      - name: Push Image
        run: |
          docker push ghcr.io/${{ github.actor }}/payment_service:${{ github.sha }}
