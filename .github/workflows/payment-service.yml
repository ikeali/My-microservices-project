name: PAYMENT SERVICE CI/CD

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - "payment_service/**"
      - ".github/workflows/payment-service.yml"
  workflow_dispatch:

concurrency:
  group: payment-service
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/payment-service:${{ github.sha }} \
            ./payment_service

      - name: Push Docker Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/payment-service:${{ github.sha }}

      - name: Clone GitOps Repository
        run: |
          git clone \
            https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/ikeali/gitops-infra.git

      - name: Update Helm Values
        run: |
          sed -i 's|tag:.*|tag: "${{ github.sha }}"|' \
          gitops-infra/helm/payment-service/values.yaml

      - name: Commit and Push Changes
        run: |
          cd gitops-infra

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/payment-service/values.yaml

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "ci: update payment-service image to ${{ github.sha }}"
          git push origin main