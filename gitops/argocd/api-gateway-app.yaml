apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: api-gateway
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ikeali/microservices-devops-project.git
    targetRevision: feature/devops/auth-service-cicd

    path: helm/api-gateway

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true