version: '3.8'

services:
  product-db:
    image: postgres:15
    environment:
      # POSTGRES_DB: product_db
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"

    volumes:
    - product_db_data:/var/lib/postgresql/data

  product-service:
    build: .
    image: product-service:latest
    ports:
      - "8003:8000"
    depends_on:
      - product-db
    env_file:
      - .env

volumes:
  product_db_data:
  
networks:
  default:
    external:
      name: microservices-net