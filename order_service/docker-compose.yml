version: '3.8'

services:
  order-db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5437:5432"

  order-service:
    build: .
    ports:
      - "8005:8000"
    depends_on:
      - order-db
    env_file:
      - .env

networks:
  default:
    external:
      name: microservices-net
