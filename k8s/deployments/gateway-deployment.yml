apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: 851759420144.dkr.ecr.us-east-2.amazonaws.com/api-gateway:60c7b156065a88c80ce5883a892b6cd26a297833
          ports:
            - containerPort: 80